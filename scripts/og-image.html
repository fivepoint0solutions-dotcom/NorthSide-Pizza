<!doctype html>
<!--
  Source for public/brand/og-image.png (1200×630).
  Regenerate after a brand change by opening this file at 1200×630 and
  exporting a PNG (any headless browser screenshot will do).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap");
      :root {
        --teal: #1f7a7d;
        --deep: #134a5c;
        --amber: #edab44;
        --coral: #e58a62;
        --plum: #8b5090;
        --ink: #21313a;
        --cream: #fbf7ef;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: var(--cream);
        font-family: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        padding: 70px 84px;
      }
      .wash {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
      }
      .wash-a { width: 520px; height: 520px; top: -230px; right: -150px;
        background: linear-gradient(118deg, var(--teal), var(--plum) 65%, var(--coral)); opacity: .34; }
      .wash-b { width: 460px; height: 460px; bottom: -230px; left: -150px;
        background: linear-gradient(118deg, var(--amber), var(--coral)); opacity: .3; }
      .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
      .brand span {
        font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
        font-weight: 700; font-size: 30px; letter-spacing: -0.02em;
      }
      .brand span em { font-style: normal; color: var(--teal); }
      h1 {
        font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
        font-size: 72px; line-height: 1.04; letter-spacing: -0.034em; font-weight: 700;
        max-width: 15ch;
      }
      h1 .accent {
        background: linear-gradient(100deg, var(--teal), var(--plum) 55%, var(--coral));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { margin-top: 26px; font-size: 25px; line-height: 1.45; color: #4c5b64; max-width: 34ch; }
      .meta {
        margin-top: 38px;
        display: flex; gap: 14px; align-items: center; font-size: 19px; color: #5d6b73;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    </style>
  </head>
  <body>
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>

    <div class="brand">
      <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
        <defs>
          <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1F7A7D" />
            <stop offset="60%" stop-color="#8B5090" />
            <stop offset="100%" stop-color="#E58A62" />
          </linearGradient>
          <linearGradient id="b" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#EDAB44" />
            <stop offset="100%" stop-color="#E58A62" />
          </linearGradient>
        </defs>
        <path d="M24 3c11.6 0 21 9.4 21 21 0 11.6-9.4 21-21 21-3.4 0-6.6-.8-9.4-2.2L4 45.5l2.9-9.9A20.9 20.9 0 0 1 3 24C3 12.4 12.4 3 24 3Z" fill="url(#a)" />
        <circle cx="19.5" cy="19" r="5.1" fill="#fff" fill-opacity=".95" />
        <path d="M10.6 33.5c0-4.9 4-8.9 8.9-8.9s8.9 4 8.9 8.9c0 .9-.7 1.6-1.6 1.6H12.2c-.9 0-1.6-.7-1.6-1.6Z" fill="#fff" fill-opacity=".95" />
        <path d="M33.5 12.4l1.6 4.3 4.3 1.6-4.3 1.6-1.6 4.3-1.6-4.3-4.3-1.6 4.3-1.6 1.6-4.3Z" fill="url(#b)" />
      </svg>
      <span>Senior <em>Sidekick</em></span>
    </div>

    <h1>Good morning.<br /><span class="accent">What should we do today?</span></h1>
    <p>A warm, talking companion for older adults — and peace of mind for the people who love them.</p>

    <div class="meta">
      <span>Voice-first</span><span class="dot"></span>
      <span>English · Français · Español · हिन्दी</span><span class="dot"></span>
      <span>Private by design</span>
    </div>
  </body>
</html>
