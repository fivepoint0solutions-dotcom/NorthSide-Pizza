<!doctype html>
<!--
  Source for public/brand/og-image.png (1200×630).
  Regenerate after a brand change by opening this file at 1200×630 and
  exporting a PNG (any headless browser screenshot will do).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap");
      :root {
        --rose: #c0708a;
        --rose-deep: #a85c77;
        --blue: #6c86b4;
        --lavender: #8b7ba8;
        --amber: #d8933f;
        --ink: #1b2430;
        --pearl: #faf6f0;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: var(--pearl);
        font-family: "Poppins", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        padding: 70px 84px;
      }
      .wash {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
      }
      .wash-a { width: 520px; height: 520px; top: -230px; right: -150px;
        background: linear-gradient(118deg, var(--rose), var(--lavender) 60%, var(--blue)); opacity: .34; }
      .wash-b { width: 460px; height: 460px; bottom: -230px; left: -150px;
        background: linear-gradient(118deg, var(--amber), var(--rose)); opacity: .3; }
      .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
      .brand span {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700; font-size: 30px; letter-spacing: -0.02em;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 72px; line-height: 1.04; letter-spacing: -0.034em; font-weight: 700;
        max-width: 15ch;
      }
      h1 .accent em { font-style: italic; }
      h1 .accent {
        background: linear-gradient(100deg, var(--rose-deep), var(--lavender) 50%, var(--blue));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { margin-top: 26px; font-size: 25px; line-height: 1.45; color: #4c5b64; max-width: 34ch; }
      .meta {
        margin-top: 38px;
        display: flex; gap: 14px; align-items: center; font-size: 19px; color: #5d6b73;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    </style>
  </head>
  <body>
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>

    <div class="brand">
      <svg viewBox="0 0 64 64" width="54" height="54" aria-hidden="true">
        <defs>
          <linearGradient id="f" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#D8933F" />
            <stop offset="55%" stop-color="#C0708A" />
            <stop offset="100%" stop-color="#6C86B4" />
          </linearGradient>
        </defs>
        <path d="M51 6C31 10 15 26 12 46l-3 12 9-6c19-3 33-19 33-46Z" fill="url(#f)" />
        <path d="M49 9 15 56" stroke="#fff" stroke-opacity=".65" stroke-width="2" stroke-linecap="round" />
        <g stroke="#fff" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round">
          <path d="M43 14 30 20" /><path d="M38 21 25 28" />
          <path d="M33 28 21 36" /><path d="M28 35 17 44" />
        </g>
      </svg>
      <span>SR Sidekick</span>
    </div>

    <h1>Good morning.<br /><span class="accent"><em>What should we do today?</em></span></h1>
    <p>A calm daily companion for orientation, safety, and emotional connection.</p>

    <div class="meta">
      <span>Voice-first</span><span class="dot"></span>
      <span>English · Français · Español · हिन्दी</span><span class="dot"></span>
      <span>Private by design</span>
    </div>
  </body>
</html>
